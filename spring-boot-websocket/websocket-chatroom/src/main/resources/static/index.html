<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Room</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
  <script src="../js/sockjs.min.js"></script>
  <script src="../js/jquery-3.6.0.min.js"></script>
  <script src="../js/stomp.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    :root {
      --bg: #0b1120;
      --card: #141d33;
      --card-2: #0d1425;
      --border: #26334f;
      --text: #e6ecf7;
      --muted: #93a4c3;
      --accent: #8b5cf6;
      --accent-2: #6366f1;
      --accent-soft: rgba(139, 92, 246, .16);
      --ok: #34d399;
      --err: #f87171;
      --radius: 14px;
      --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, "JetBrains Mono", monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    body {
      font-family: var(--sans);
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(1100px 520px at 15% -10%, var(--accent-soft), transparent 60%),
        radial-gradient(900px 460px at 95% -5%, rgba(56, 189, 248, .10), transparent 55%),
        var(--bg);
    }
    .app { max-width: 760px; margin: 0 auto; padding: 28px 20px 56px; }

    .app-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark { width: 44px; height: 44px; border-radius: 13px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 21px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 8px 22px rgba(139, 92, 246, .35); }
    .brand h1 { font-size: 19px; font-weight: 700; margin: 0; letter-spacing: .2px; }
    .brand p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }
    .pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
    .pill.on { color: var(--ok); border-color: rgba(52, 211, 153, .45); background: rgba(52, 211, 153, .08); }
    .pill.on .dot { background: var(--ok); box-shadow: 0 0 10px var(--ok); animation: pulse 1.5s infinite; }
    @keyframes pulse { 50% { opacity: .4; } }

    .card { background: linear-gradient(180deg, rgba(255, 255, 255, .025), rgba(255, 255, 255, 0) 40%), var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 14px 34px rgba(2, 6, 23, .38); }
    .card h2 { font-size: 11.5px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
    label.f { display: block; margin: 0 0 7px 3px; font-size: 12px; color: var(--muted); }
    input[type="text"], input:not([type]) {
      width: 100%; padding: 10px 12px; font-size: 14px; font-family: var(--sans); color: var(--text);
      background: var(--card-2); border: 1px solid var(--border); border-radius: 10px; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    input:disabled { opacity: .55; }

    button { border: none; border-radius: 10px; padding: 10px 16px; font-size: 14px; font-weight: 600; font-family: var(--sans); color: #fff; background: var(--accent); cursor: pointer; transition: filter .15s, transform .06s, opacity .15s; }
    button:hover:not(:disabled) { filter: brightness(1.13); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .42; cursor: not-allowed; }
    button.danger { background: transparent; border: 1px solid rgba(248, 113, 113, .45); color: var(--err); }
    button.danger:hover:not(:disabled) { filter: none; background: rgba(248, 113, 113, .09); border-color: rgba(248, 113, 113, .7); }

    .join-card { padding: 18px; margin-bottom: 16px; }
    .join-row { display: flex; gap: 10px; }
    .join-row input { flex: 1; }
    .join-row button { flex: none; }

    .chat-card { display: none; flex-direction: column; overflow: hidden; }
    .messages { height: 400px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #0a101d; }
    .messages:empty::before {
      content: "No messages yet — say hi 👋";
      margin: auto; color: #55658a; font-size: 12.5px; font-family: var(--mono);
    }
    .msg { display: flex; gap: 10px; max-width: 80%; animation: rise .18s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .msg .avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #fff; }
    .msg .meta { font-size: 11px; color: var(--muted); margin-bottom: 3px; font-family: var(--mono); }
    .msg .bubble { background: var(--card); border: 1px solid var(--border); padding: 9px 13px; border-radius: 4px 12px 12px 12px; font-size: 14px; line-height: 1.5; word-wrap: break-word; overflow-wrap: anywhere; }
    .msg.mine { align-self: flex-end; flex-direction: row-reverse; }
    .msg.mine .meta { text-align: right; }
    .msg.mine .bubble { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none; color: #fff; border-radius: 12px 4px 12px 12px; box-shadow: 0 6px 16px rgba(139, 92, 246, .3); }

    .composer { display: flex; gap: 10px; padding: 14px; border-top: 1px solid var(--border); }
    .composer input { flex: 1; }
    .composer button { flex: none; padding: 10px 22px; }

    .hint { margin-top: 20px; text-align: center; font-family: var(--mono); font-size: 11.5px; color: #55658a; }

    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-thumb { background: #2a3a5e; border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: #35497a; }
    ::-webkit-scrollbar-track { background: transparent; }

    @media (max-width: 620px) {
      .msg { max-width: 92%; }
      .join-row { flex-wrap: wrap; }
      .join-row input { flex: 1 1 100%; }
    }
  </style>

  <script type="text/javascript">
    var stompClient = null;

    var AVATAR_COLORS = ['#6366f1', '#ec4899', '#f59e0b', '#10b981', '#06b6d4', '#8b5cf6', '#ef4444', '#84cc16'];

    function colorFor(name) {
      var sum = 0;
      for (var i = 0; i < name.length; i++) {
        sum += name.charCodeAt(i);
      }
      return AVATAR_COLORS[sum % AVATAR_COLORS.length];
    }

    function setConnected(connected) {
      document.getElementById('connect').disabled = connected;
      document.getElementById('disconnect').disabled = !connected;
      document.getElementById('from').disabled = connected;
      document.getElementById('conversationDiv').style.display = connected ? 'flex' : 'none';
      document.getElementById('connPill').classList.toggle('on', connected);
      document.getElementById('connLabel').textContent = connected ? 'Connected' : 'Disconnected';
      document.getElementById('response').innerHTML = '';
    }

    function connect() {
      var from = document.getElementById('from');
      if (!from.value.trim()) {
        from.focus();
        return;
      }
      var socket = new SockJS('http://localhost:8080/chatroom');
      stompClient = Stomp.over(socket);
      stompClient.connect({}, function (frame) {
        setConnected(true);
        console.log('Connected: ' + frame);
        stompClient.subscribe('/topic/messages', function (message) {
          showmessage(JSON.parse(message.body));
        });
      });
    }

    function disconnect() {
      if (stompClient != null) {
        stompClient.disconnect();
        stompClient = null;
      }
      setConnected(false);
      console.log("Disconnected");
    }

    function sendMessage() {
      if (stompClient == null) {
        return;
      }
      var from = document.getElementById('from').value;
      var text = document.getElementById('text').value;
      if (!text.trim()) {
        return;
      }
      stompClient.send("/app/chat", {},
          JSON.stringify({'from': from, 'text': text}));
      document.getElementById('text').value = '';
      document.getElementById('text').focus();
    }

    function showmessage(message) {
      var response = document.getElementById('response');
      var mine = message.from === document.getElementById('from').value;

      var wrap = document.createElement('div');
      wrap.className = 'msg' + (mine ? ' mine' : '');

      var avatar = document.createElement('span');
      avatar.className = 'avatar';
      avatar.style.background = colorFor(message.from || '?');
      avatar.textContent = (message.from || '?').charAt(0).toUpperCase();

      var body = document.createElement('div');

      var meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = message.from + ' · ' + new Date().toLocaleTimeString();

      var bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.appendChild(document.createTextNode(message.text));

      body.appendChild(meta);
      body.appendChild(bubble);
      wrap.appendChild(avatar);
      wrap.appendChild(body);
      response.appendChild(wrap);
      response.scrollTop = response.scrollHeight;
    }

    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('text').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          sendMessage();
        }
      });
    });
  </script>
</head>

<body onload="disconnect();">
<div class="app">
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark">💬</div>
      <div>
        <h1>Chat Room</h1>
        <p>SockJS + STOMP over WebSocket · broadcast demo</p>
      </div>
    </div>
    <div class="pill" id="connPill"><span class="dot"></span><span id="connLabel">Disconnected</span></div>
  </header>

  <section class="card join-card">
    <h2>Join</h2>
    <label class="f" for="from">Nickname</label>
    <div class="join-row">
      <input id="from" placeholder="Choose a nickname" type="text" maxlength="20" autocomplete="off">
      <button id="connect" onclick="connect();">Connect</button>
      <button id="disconnect" class="danger" onclick="disconnect();" disabled>Disconnect</button>
    </div>
  </section>

  <section class="card chat-card" id="conversationDiv">
    <div class="messages" id="response"></div>
    <div class="composer">
      <input id="text" placeholder="Write a message…" type="text" autocomplete="off">
      <button id="sendMessage" onclick="sendMessage();">Send</button>
    </div>
  </section>

  <footer class="hint">spring-boot-samples · websocket-chatroom</footer>
</div>
</body>
</html>
