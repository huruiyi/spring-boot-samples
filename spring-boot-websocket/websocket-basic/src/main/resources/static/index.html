<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebSocket Tester</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('websocket-basic.theme') || 'dark');</script>
  <link rel="stylesheet" href="css/app.css?v=11">
  <script src="js/jquery-3.6.0.min.js"></script>
  <script src="js/app.js?v=10"></script>
</head>

<body>
<div class="app">
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark">⚡</div>
      <div>
        <h1>WebSocket Tester</h1>
        <p>Native WebSocket · echo / broadcast demo</p>
      </div>
    </div>
    <div class="header-pills">
      <button type="button" class="theme-toggle" id="themeToggle" title="Switch theme">Light</button>
    </div>
  </header>

  <main class="layout">
    <aside class="online-panel card">
      <div class="term-head"><span>Online</span><span class="tag" id="onlineCountTag">0</span></div>
      <ul id="onlineList" class="online-list"></ul>
    </aside>

    <section class="chat-panel">
      <div class="card term-card chat-messages">
        <div class="term-head">
          <span>Messages</span>
          <span class="tags">
            <span class="tag violet" id="sendTag">send</span>
            <span class="tag violet" id="recvTag">recv</span>
          </span>
        </div>
        <div id="messageOutput" class="msg-list"></div>
      </div>

      <section class="card pad composer">
        <div class="composer-row">
          <div class="composer-input">
            <input id="message" placeholder="Type a message…" autocomplete="off" disabled>
          </div>
          <button id="send" class="composer-send" disabled>Send</button>
        </div>
      </section>
    </section>

    <aside class="side-panel">
      <section class="card pad">
        <h2>Connection</h2>
        <label class="f" for="username">Username</label>
        <input id="username" placeholder="Set a name before connecting" maxlength="20" autocomplete="nickname">
        <label class="f spaced" for="target">Endpoint</label>
        <input id="target" class="mono" value="ws://localhost:8080/echoHandler" spellcheck="false" autocomplete="off">
        <div class="btn-row">
          <button id="connect">Connect</button>
          <button id="disconnect" class="danger" disabled>Disconnect</button>
        </div>
      </section>

      <section class="card pad mode-panel">
        <h2>Broadcast</h2>
        <label class="switch-row" for="sendBroadcast">
          <span>Send broadcasts</span>
          <span class="switch">
            <input id="sendBroadcast" type="checkbox" checked>
            <span class="slider"></span>
          </span>
        </label>
        <label class="switch-row" for="recvBroadcast">
          <span>Receive broadcasts</span>
          <span class="switch">
            <input id="recvBroadcast" type="checkbox" checked>
            <span class="slider"></span>
          </span>
        </label>
      </section>

      <section class="card status-panel">
        <div class="term-head"><span>Status</span></div>
        <div class="live-status">
          <div class="live-row">
            <span class="live-label">Connection</span>
            <span class="live-value" id="connLive"><span class="dot"></span><span id="connLabel">Disconnected</span></span>
          </div>
          <div class="live-row">
            <span class="live-label">Heartbeat</span>
            <span class="live-value" id="pingLive"><span class="dot"></span><span id="pingLabel">Idle</span></span>
          </div>
          <div class="live-row">
            <span class="live-label">Online</span>
            <span class="live-value" id="onlineLive">-</span>
          </div>
        </div>
      </section>
    </aside>
  </main>
</div>
</body>
</html>
