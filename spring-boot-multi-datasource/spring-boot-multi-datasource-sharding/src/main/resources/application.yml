server:
  port: 8085

spring:
  shardingsphere:
    datasource:
      names: master, slave0, slave1     # 三节点：1主2从
      master:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://127.0.0.1:3306/db_master?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
        username: root
        password: root
      slave0:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://127.0.0.1:3306/db_slave0?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
        username: root
        password: root
      slave1:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://127.0.0.1:3306/db_slave1?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
        username: root
        password: root

    rules:
      readwrite-splitting:
        data-sources:
          ms-group:                      # 读写分离组名
            type: Static                # 静态发现（也可用 Dynamic）
            props:
              write-data-source-name: master
              read-data-source-names: slave0, slave1   # 多个从库做负载均衡
            load-balancer-name: round_robin  # 轮询策略

        load-balancers:
          round_robin:
            type: ROUND_ROBIN
          random:
            type: RANDOM

    props:
      sql-show: true                    # 打印最终 SQL，方便调试

mybatis-plus:
  type-aliases-package: com.example.sharding.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
