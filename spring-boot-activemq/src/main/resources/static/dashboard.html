<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ActiveMQ Demo Dashboard</title>
    <style>
        :root {
            --bg: #0f1117;
            --card-bg: #1a1d27;
            --border: #2a2d3a;
            --text: #e1e4ed;
            --text-dim: #8b8fa3;
            --accent: #6366f1;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --queue: #06b6d4;
            --topic: #a855f7;
            --sent: #f59e0b;
            --received: #22c55e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }
        .app {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 400px;
            min-width: 400px;
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .sidebar-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar-header h1 {
            font-size: 22px;
            font-weight: 700;
        }
        .sidebar-header p {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 4px;
            -webkit-text-fill-color: var(--text-dim);
        }
        .sidebar-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

        .card {
            background: #232632;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
        }
        .card-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .badge {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-queue { background: rgba(6,182,212,0.15); color: var(--queue); }
        .badge-topic { background: rgba(168,85,247,0.15); color: var(--topic); }

        .form-group { margin-bottom: 10px; }
        .form-group:last-child { margin-bottom: 0; }
        .form-group label {
            display: block;
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 5px;
            font-weight: 500;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 9px 12px;
            background: #1a1d27;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 13px;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        .form-group textarea { resize: vertical; min-height: 50px; }
        .row { display: flex; gap: 8px; }
        .row .form-group { flex: 1; }

        .btn {
            width: 100%;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
        }
        .btn-queue { background: var(--queue); }
        .btn-queue:hover { background: #0891b2; transform: translateY(-1px); }
        .btn-topic { background: var(--topic); }
        .btn-topic:hover { background: #9333ea; transform: translateY(-1px); }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .main-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .main-header h2 { font-size: 16px; }
        .stats {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: var(--text-dim);
        }
        .stats span { font-weight: 700; color: var(--text); }

        .log-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px 24px;
        }
        .log-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-dim);
            gap: 10px;
        }
        .log-empty .icon { font-size: 48px; opacity: 0.3; }
        .log-empty p { font-size: 14px; }

        .log-entry {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 6px;
            background: #232632;
            border: 1px solid transparent;
            animation: slideIn 0.3s ease;
            transition: background 0.2s;
        }
        .log-entry:hover { background: #2a2d3b; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .log-dir {
            font-size: 10px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            min-width: 56px;
            text-align: center;
            letter-spacing: 0.5px;
        }
        .log-dir.sent { background: rgba(245,158,11,0.15); color: var(--sent); }
        .log-dir.received { background: rgba(34,197,94,0.15); color: var(--received); }

        .log-body { flex: 1; min-width: 0; }
        .log-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 3px;
        }
        .log-content {
            font-size: 13px;
            word-break: break-all;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            color: #c9cdd6;
            background: #1a1d27;
            padding: 6px 10px;
            border-radius: 4px;
            line-height: 1.5;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: white;
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.5s forwards;
            z-index: 100;
        }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>ActiveMQ Demo</h1>
            <p>Point-to-Point &amp; Publish-Subscribe</p>
        </div>
        <div class="sidebar-body">
            <div class="card">
                <div class="card-title"><span class="badge badge-queue">Queue</span> Send Todo Message</div>
                <div class="row">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="qt-title" placeholder="e.g. Buy groceries" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>ID (auto)</label>
                        <input type="number" id="qt-id" placeholder="Auto" autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label>Content</label>
                    <textarea id="qt-content" placeholder="e.g. Milk, eggs, bread..." autocomplete="off"></textarea>
                </div>
                <button class="btn btn-queue" onclick="sendQueueTodo()">Send to todo-queue</button>
            </div>

            <div class="card">
                <div class="card-title"><span class="badge badge-queue">Queue</span> Send Text Message</div>
                <div class="form-group">
                    <label>Message</label>
                    <input type="text" id="qtxt-msg" placeholder="Enter text message..." autocomplete="off">
                </div>
                <button class="btn btn-queue" onclick="sendQueueText()">Send to text-queue</button>
            </div>

            <div class="card">
                <div class="card-title"><span class="badge badge-topic">Topic</span> Broadcast Todo</div>
                <div class="row">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="tt-title" placeholder="e.g. Team announcement" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>ID (auto)</label>
                        <input type="number" id="tt-id" placeholder="Auto" autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label>Content</label>
                    <textarea id="tt-content" placeholder="e.g. Meeting at 3pm..." autocomplete="off"></textarea>
                </div>
                <button class="btn btn-topic" onclick="sendTopicTodo()">Send to todo-topic</button>
            </div>

            <div class="card">
                <div class="card-title"><span class="badge badge-topic">Topic</span> Broadcast Notification</div>
                <div class="form-group">
                    <label>Notification Text</label>
                    <input type="text" id="tn-text" placeholder="Enter notification..." autocomplete="off">
                </div>
                <button class="btn btn-topic" onclick="sendTopicNotif()">Send to notification-topic</button>
            </div>

            <div class="card">
                <div class="card-title"><span class="badge badge-queue">Queue</span> Legacy Message</div>
                <div class="form-group">
                    <label>Text</label>
                    <input type="text" id="legacy-text" placeholder="hello activemq" autocomplete="off" value="hello activemq">
                </div>
                <button class="btn btn-queue" onclick="sendLegacy()">Send to activemq-listener</button>
            </div>
        </div>
    </aside>

    <main class="main">
        <div class="main-header">
            <h2>Live Message Feed</h2>
            <div class="stats">
                Sent: <span id="sent-count">0</span> | Received: <span id="recv-count">0</span>
            </div>
        </div>
        <div class="log-container" id="log-container">
            <div class="log-empty">
                <span class="icon">&#x1F4ED;</span>
                <p>No messages yet. Send one from the left panel to get started!</p>
            </div>
        </div>
    </main>
</div>

<script>
    const API = '/api/message';
    const LOG_API = '/api/log';
    const WS_URL = (location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/ws/log';

    let sentCount = 0;
    let recvCount = 0;

    function showToast(text, type) {
        const t = document.createElement('div');
        t.className = 'toast ' + type;
        t.textContent = text;
        document.body.appendChild(t);
        setTimeout(function() { t.remove(); }, 3000);
    }

    async function postJson(url, body) {
        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error(await res.text());
        return res.text();
    }

    async function postForm(url, params) {
        const qs = new URLSearchParams(params).toString();
        const res = await fetch(url + '?' + qs, { method: 'POST' });
        if (!res.ok) throw new Error(await res.text());
        return res.text();
    }

    async function sendQueueTodo() {
        const body = {
            title: document.getElementById('qt-title').value || 'Untitled',
            content: document.getElementById('qt-content').value || 'No content'
        };
        const idVal = document.getElementById('qt-id').value;
        if (idVal) body.id = parseInt(idVal);
        try {
            await postJson(API + '/queue/todo', body);
            showToast('Todo sent to queue!', 'success');
            ['qt-title', 'qt-id', 'qt-content'].forEach(function(id) { document.getElementById(id).value = ''; });
        } catch (e) { showToast('Error: ' + e.message, 'error'); }
    }

    async function sendQueueText() {
        const text = document.getElementById('qtxt-msg').value.trim();
        if (!text) { showToast('Please enter a message', 'error'); return; }
        try {
            await postForm(API + '/queue/text', { text: text, destination: 'text-queue' });
            showToast('Text sent to queue!', 'success');
            document.getElementById('qtxt-msg').value = '';
        } catch (e) { showToast('Error: ' + e.message, 'error'); }
    }

    async function sendTopicTodo() {
        const body = {
            title: document.getElementById('tt-title').value || 'Untitled',
            content: document.getElementById('tt-content').value || 'No content'
        };
        const idVal = document.getElementById('tt-id').value;
        if (idVal) body.id = parseInt(idVal);
        try {
            await postJson(API + '/topic/todo', body);
            showToast('Todo broadcast to topic!', 'success');
            ['tt-title', 'tt-id', 'tt-content'].forEach(function(id) { document.getElementById(id).value = ''; });
        } catch (e) { showToast('Error: ' + e.message, 'error'); }
    }

    async function sendTopicNotif() {
        const text = document.getElementById('tn-text').value.trim();
        if (!text) { showToast('Please enter notification text', 'error'); return; }
        try {
            await postForm(API + '/topic/notification', { text: text });
            showToast('Notification broadcast!', 'success');
            document.getElementById('tn-text').value = '';
        } catch (e) { showToast('Error: ' + e.message, 'error'); }
    }

    async function sendLegacy() {
        const text = document.getElementById('legacy-text').value.trim() || 'hello activemq';
        try {
            await postForm(API + '/queue/legacy', { text: text });
            showToast('Legacy message sent!', 'success');
        } catch (e) { showToast('Error: ' + e.message, 'error'); }
    }

    var logContainer = document.getElementById('log-container');

    function addLogEntry(entry) {
        var emptyEl = logContainer.querySelector('.log-empty');
        if (emptyEl) emptyEl.remove();

        var dir = entry.direction;
        if (dir === 'SENT') sentCount++;
        else recvCount++;
        document.getElementById('sent-count').textContent = sentCount;
        document.getElementById('recv-count').textContent = recvCount;

        var el = document.createElement('div');
        el.className = 'log-entry';
        el.innerHTML =
            '<span class="log-dir ' + (dir === 'SENT' ? 'sent' : 'received') + '">' + dir + '</span>' +
            '<div class="log-body">' +
            '<div class="log-meta">' +
            '<span>' + entry.timestamp + '</span>' +
            '<span style="color:' + (entry.type === 'QUEUE' ? '#06b6d4' : '#a855f7') + '">' + entry.type + '</span>' +
            '<span style="color:#8b8fa3">' + '\u2192 ' + entry.destination + '</span>' +
            '</div>' +
            '<div class="log-content">' + escapeHtml(entry.content) + '</div>' +
            '</div>';
        logContainer.prepend(el);
    }

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function connectWebSocket() {
        var ws = new WebSocket(WS_URL);
        ws.onmessage = function(e) {
            try {
                var entry = JSON.parse(e.data);
                addLogEntry(entry);
            } catch (ex) { }
        };
        ws.onclose = function() {
            console.log('WebSocket disconnected, reconnecting in 3s...');
            setTimeout(connectWebSocket, 3000);
        };
        ws.onerror = function() { ws.close(); };
    }

    async function loadHistory() {
        try {
            var res = await fetch(LOG_API);
            var logs = await res.json();
            for (var i = 0; i < logs.length; i++) {
                var entry = logs[i];
                if (entry.direction === 'SENT') sentCount++;
                else recvCount++;
            }
            for (var i = 0; i < logs.length; i++) {
                addLogEntryDirect(logs[i]);
            }
            document.getElementById('sent-count').textContent = sentCount;
            document.getElementById('recv-count').textContent = recvCount;
        } catch (e) { }
    }

    function addLogEntryDirect(entry) {
        var emptyEl = logContainer.querySelector('.log-empty');
        if (emptyEl) emptyEl.remove();
        var dir = entry.direction;
        var el = document.createElement('div');
        el.className = 'log-entry';
        el.innerHTML =
            '<span class="log-dir ' + (dir === 'SENT' ? 'sent' : 'received') + '">' + dir + '</span>' +
            '<div class="log-body">' +
            '<div class="log-meta">' +
            '<span>' + entry.timestamp + '</span>' +
            '<span style="color:' + (entry.type === 'QUEUE' ? '#06b6d4' : '#a855f7') + '">' + entry.type + '</span>' +
            '<span style="color:#8b8fa3">' + '\u2192 ' + entry.destination + '</span>' +
            '</div>' +
            '<div class="log-content">' + escapeHtml(entry.content) + '</div>' +
            '</div>';
        logContainer.appendChild(el);
    }

    connectWebSocket();
    loadHistory();
</script>
</body>
</html>
